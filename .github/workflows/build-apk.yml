name: Build APK from ZIP
run-name: FinderlessCamera build #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q source.zip -d extracted

      - name: Verify source ZIP
        run: |
          echo "===== VERSION ====="
          grep -n "versionCode\|versionName" extracted/app/build.gradle.kts
          grep -q 'versionCode = 8' extracted/app/build.gradle.kts
          grep -q 'versionName = "0.1.5"' extracted/app/build.gradle.kts

          echo "===== VERIFY NO Space WIDGET ====="
          if grep -R "<Space" extracted/app/src/main/res/layout/notification_camera.xml; then
            echo "ERROR: Old notification layout detected"
            exit 1
          fi

          echo "VERIFY OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinderlessCamera-${{ github.run_number }}-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
